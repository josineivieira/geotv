<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Capa GeoTV</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #302b46;
        color: #fff;
        font-family: Arial, sans-serif;
        position: relative;
        padding: 60px 66px;
      }
      .brand {
        font-weight: 800;
        font-size: 92px;
        letter-spacing: -7px;
        line-height: 1;
      }
      .brand span {
        color: #a0d2b9;
      }
      .brand i {
        display: inline-block;
        width: 15px;
        height: 15px;
        margin-left: 13px;
        border-radius: 50%;
        background: #a298d7;
      }
      .logo {
        position: absolute;
        width: 265px;
        height: 150px;
        object-fit: contain;
        right: 45px;
        top: 35px;
      }
      .eyebrow {
        margin-top: 40px;
        color: #b9b0e4;
        letter-spacing: 4px;
        font-size: 16px;
        font-weight: 700;
      }
      h1 {
        font-size: 57px;
        line-height: 1.13;
        letter-spacing: -2px;
        margin: 20px 0 16px;
        position: relative;
        z-index: 2;
      }
      p {
        font-size: 22px;
        color: #d9d5e6;
        margin: 0;
      }
      .cta {
        position: absolute;
        bottom: 61px;
        left: 66px;
        background: #a0d2b9;
        color: #302b46;
        padding: 18px 25px;
        border-radius: 40px;
        font-weight: 700;
        letter-spacing: 1px;
        font-size: 17px;
      }
      .cta b {
        margin-left: 30px;
      }
      .screen {
        position: absolute;
        right: 76px;
        top: 265px;
        width: 248px;
        height: 160px;
        border: 3px solid #978ac9;
        border-radius: 23px;
        background: linear-gradient(135deg, #514681, #3c3458);
        transform: rotate(-7deg);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 15px 20px 0 #262238;
      }
      .play {
        width: 74px;
        height: 74px;
        border-radius: 50%;
        background: #a0d2b9;
        display: grid;
        place-items: center;
        color: #302b46;
        font-size: 33px;
        padding-left: 6px;
      }
      .line {
        position: absolute;
        right: -40px;
        bottom: 70px;
        width: 430px;
        height: 100px;
        border: 2px solid #635981;
        border-radius: 100px;
        transform: rotate(-20deg);
      }
      .line.two {
        bottom: 28px;
        right: -85px;
      }
      .footer {
        position: absolute;
        bottom: 61px;
        right: 66px;
        color: #b9b0cf;
        font-size: 13px;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div class="brand">geo<span>tv</span><i></i></div>
    <img
      class="logo"
      src="../web/assets/geomaritima-logo.png"
      alt="GeoMarítima Multimodal"
    />
    <div class="eyebrow">NOSSO CANAL. NOSSAS CONQUISTAS.</div>
    <h1>Conectando pessoas.<br />Movendo resultados.</h1>
    <p>Resultados, novidades e histórias da nossa equipe.</p>
    <div class="screen"><div class="play">▶</div></div>
    <div class="line"></div>
    <div class="line two"></div>
    <div class="cta">ASSISTA À GEOTV <b>▶</b></div>
    <div class="footer">GEOMARÍTIMA MULTIMODAL</div>
  </body>
</html>
